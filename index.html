<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Lunar Lava Tubes | 科研数据集成系统</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #000; }
        
        /* 坐标标签样式 */
        .coord-label {
            font-size: 11px !important;
            font-weight: bold;
            color: #ff4d4d;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 4px;
            border-radius: 3px;
            pointer-events: none;
        }

        /* 侧边信息面板：支持内部滚动 */
        .info-panel { 
            position: absolute; top: 20px; right: 20px; z-index: 1000; 
            background: rgba(13, 17, 23, 0.95); padding: 20px; 
            border-radius: 12px; border: 1px solid #30363d; 
            width: 320px; max-height: 90vh; overflow-y: auto;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 { font-size: 1rem; margin: 0; color: #ff4d4d; border-bottom: 1px solid #333; padding-bottom: 8px; letter-spacing: 1px; }
        h2 { font-size: 0.85rem; margin: 0 0 10px 0; color: #ff4d4d; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        
        /* 综述模块样式 */
        .summary-section { border-bottom: 1px solid #222; padding-bottom: 10px; }
        .summary-text { font-size: 0.8rem; line-height: 1.6; color: #8b949e; margin: 0 0 10px 0; text-align: justify; }

        /* 点位详情模块样式 */
        .detail-section { 
            background: rgba(255, 77, 77, 0.05); 
            border: 1px dashed #444; 
            padding: 15px; 
            border-radius: 8px;
            display: none; /* 初始隐藏，点击后显示 */
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .data-grid { display: grid; grid-template-columns: 85px 1fr; gap: 8px; font-size: 0.85rem; margin-top: 10px; }
        .label { color: #8b949e; }
        .val { color: #c9d1d9; font-family: "Cascadia Code", monospace; }

        .star-red { color: #ff4d4d; font-size: 24px; text-shadow: 0 0 10px #ff4d4d; cursor: pointer; }
        .star-yellow { color: #e3b341; font-size: 24px; text-shadow: 0 0 10px #e3b341; cursor: pointer; }

        .info-panel::-webkit-scrollbar { width: 4px; }
        .info-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="info-panel">
    <h1>LUNAR LAVA TUBES</h1>
    
    <div class="summary-section">
        <h2>研究综述 | Overview</h2>
        <p class="summary-text">
            月球熔岩管是古代火山活动遗留的地下空间。其厚重覆盖层能提供天然的辐射屏蔽、微陨石保护及恒温环境（约 -35°C），是建设月球长期科研基地的理想选址。
        </p>
        <p class="summary-text" style="font-size: 0.75rem;">
            本系统展示了 21 个高价值探测位点，包括 12 个含详细测量数据的天窗（Skylights）。
        </p>
    </div>

    <div id="detail-box" class="detail-section">
        <h2>位点详情 | Detail</h2>
        <b id="detail-name" style="font-size: 1.1rem; color: #fff; display: block; margin-bottom: 10px;">-</b>
        <div class="data-grid">
            <span class="label">区域类型:</span><span id="detail-zone" class="val">-</span>
            <span class="label">深度参数:</span><span id="detail-depth" class="val">-</span>
            <span class="label">入口直径:</span><span id="detail-size" class="val">-</span>
            <span class="label">观测经度:</span><span id="detail-lng" class="val">-</span>
            <span class="label">观测纬度:</span><span id="detail-lat" class="val">-</span>
        </div>
        <p id="detail-desc" class="summary-text" style="margin-top: 15px; font-style: italic; border-top: 1px solid #333; padding-top: 10px;"></p>
    </div>

    <p id="guide-text" style="font-size:0.75rem; color:#555; text-align: center;">点击地图星标查看详细参数</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 地图初始化与网格逻辑 (保持不变以确保 0-360 精度)
    const map = L.map('map', {
        center: [0, 0], zoom: 3, minZoom: 2, maxZoom: 8,
        maxBounds: [[-90, -180], [90, 180]], maxBoundsViscosity: 1.0,
        attributionControl: false
    });

    L.tileLayer('https://cartocdn-gusc.global.ssl.fastly.net/opmbuilder/api/v1/map/named/opm-moon-basemap-v0-1/all/{z}/{x}/{y}.png', {
        noWrap: true, bounds: [[-90, -180], [90, 180]]
    }).addTo(map);

    const gridLayer = L.layerGroup().addTo(map);
    function updateGrid() {
        gridLayer.clearLayers();
        const bounds = map.getBounds();
        const interval = map.getZoom() > 4 ? 10 : 30;
        for (let lat = -90; lat <= 90; lat += interval) {
            L.polyline([[lat, -180], [lat, 180]], {color: '#ff4d4d', weight: 0.5, opacity: 0.2, dashArray: '5,5'}).addTo(gridLayer);
            L.marker([lat, bounds.getWest()], {
                icon: L.divIcon({ className: 'coord-label', html: `${lat}°${lat>=0?'N':'S'}`, iconSize: [40, 20], iconAnchor: [-5, 10] })
            }).addTo(gridLayer);
        }
        for (let lng = -180; lng <= 180; lng += interval) {
            L.polyline([[-90, lng], [90, lng]], {color: '#ff4d4d', weight: 0.5, opacity: 0.2, dashArray: '5,5'}).addTo(gridLayer);
            let dLng = lng < 0 ? (lng + 360) : lng;
            if(dLng === 360) dLng = 0;
            L.marker([bounds.getNorth(), lng], {
                icon: L.divIcon({ className: 'coord-label', html: `${dLng.toFixed(0)}°E`, iconSize: [40, 20], iconAnchor: [20, -5] })
            }).addTo(gridLayer);
        }
    }
    map.on('move zoom', updateGrid);
    updateGrid();

    // 21 个点位数据
    const fullData = [
        { name: "静海", lat: 8.3355, lng: 33.2220, depth: "105", size: "100 × 88", zone: "月海", desc: "月球已知最深的坑洞，位于静海中部，是熔岩管进入月球内部的重要门户。" },
        { name: "马利厄斯山", lat: 14.0917, lng: 303.2299 - 360, depth: "40", size: "55 × 49", zone: "月海", desc: "由日本 SELENE 探测器发现，位于火山密集区，是科研价值极高的候选地。" },
        { name: "智海", lat: -35.9494, lng: 166.0559, depth: "55", size: "104 × 71", zone: "月海", desc: "月球背面的重要位点，地质构造独特且空间规模巨大。" },
        { name: "北风暴洋-1", lat: 35.4097, lng: 314.3602 - 360, depth: "54", size: "157 × 108", zone: "月海", desc: "风暴洋区域的代表性熔岩管结构，具有显著的形态特征。" },
        { name: "死湖", lat: 44.9608, lng: 25.6119, depth: "60", size: ">165 × 110", zone: "月海", desc: "位于高纬度月海区域，适合研究极地环境下的地下利用。" },
        { name: "西南丰富海", lat: -6.7521, lng: 42.7595, depth: "51", size: "19 × 15", zone: "高地", desc: "位于高地边缘，地质年代较久远且环境极为稳定。" },
        { name: "西南静海", lat: 4.1438, lng: 24.6871, depth: "25", size: "32 × 26", zone: "月海", desc: "浅层熔岩管位点，易于开展初期无人探测任务。" },
        { name: "朗格撞击坑", lat: -2.7024, lng: 86.7800, depth: "5", size: "14 × 12", zone: "月海", desc: "撞击坑内部的天窗结构，研究撞击地质的理想案例。" },
        { name: "施吕特撞击坑", lat: -5.8395, lng: 276.9500 - 360, depth: "57", size: "37 × 23", zone: "高地", desc: "深埋于高地地层下的空腔，反映了复杂的地壳演化。" },
        { name: "高地-1", lat: 43.9662, lng: 23.0836, depth: "27", size: "41 × 37", zone: "高地", desc: "北部高地区域的重要调查点位。" },
        { name: "高地-2", lat: 41.1563, lng: 18.8206, depth: ">24", size: "34 × 27", zone: "高地", desc: "地形复杂的候选研究区。" },
        { name: "高地-3", lat: 42.3941, lng: 320.3076 - 360, depth: "27", size: "45 × 41", zone: "高地", desc: "高地熔岩管形态多样性的典型代表。" },
        { name: "雨海东部", lat: 26.1, lng: -0.5, depth: "待定", size: "大型", zone: "月海", desc: "雨海平原内的潜在巨型隧道。" },
        { name: "澄海边缘", lat: 27.5, lng: 18.2, depth: "待定", size: "中型", zone: "月海", desc: "盆地交界处的火山通道遗迹。" },
        { name: "莫斯科海", lat: 27.3, lng: 147.9, depth: "待定", size: "大型", zone: "月海", desc: "背面最大的熔岩管候选区之一。" },
        { name: "康普顿高地", lat: 55.3, lng: 103.8, depth: "待定", size: "小型", zone: "高地", desc: "高纬度探测的关键区域。" },
        { name: "湿海", lat: -24.5, lng: -39.2, depth: "待定", size: "中型", zone: "月海", desc: "湿海盆地内的结构性空腔。" },
        { name: "哥白尼坑周边", lat: 10.5, lng: -20.1, depth: "待定", size: "中型", zone: "月海", desc: "受著名撞击坑喷发活动影响形成的空腔。" },
        { name: "阿里斯塔克斯高地", lat: 23.7, lng: -47.4, depth: "待定", size: "特殊型", zone: "高地", desc: "具有高反射率地质特征的神秘位点。" },
        { name: "泰欧菲鲁斯", lat: -11.4, lng: 26.4, depth: "待定", size: "中型", zone: "高地", desc: "环形山背景下的地质探测点。" },
        { name: "柏拉图坑边缘", lat: 51.6, lng: -9.4, depth: "待定", size: "极地型", zone: "高地", desc: "未来极地资源利用的重要枢纽。" }
    ];

    const getIcon = (zone) => L.divIcon({ 
        className: zone === '月海' ? 'star-red' : 'star-yellow', 
        html: '★', iconSize: [30, 30], iconAnchor: [15, 15] 
    });

    fullData.forEach(item => {
        L.marker([item.lat, item.lng], { icon: getIcon(item.zone) })
        .addTo(map)
        .on('click', () => {
            // 更新并显示详情模块
            document.getElementById('detail-box').style.display = 'block';
            document.getElementById('guide-text').style.display = 'none';
            
            document.getElementById('detail-name').innerText = item.name;
            document.getElementById('detail-zone').innerText = item.zone;
            document.getElementById('detail-depth').innerText = item.depth + " m";
            document.getElementById('detail-size').innerText = item.size + " m";
            document.getElementById('detail-lat').innerText = item.lat.toFixed(4) + "°N";
            let dLng = item.lng < 0 ? (item.lng + 360).toFixed(4) : item.lng.toFixed(4);
            document.getElementById('detail-lng').innerText = dLng + "°E";
            document.getElementById('detail-desc').innerText = item.desc;
            
            map.panTo([item.lat, item.lng]);
        });
    });
</script>
</body>
</html>
